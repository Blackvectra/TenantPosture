<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TenantPosture</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1>TenantPosture <span class="ver">GUI</span></h1>
    <div class="status" id="status">Ready</div>
  </header>

  <main id="layout-main">
    <section id="panel-history" class="panel full">
      <h2>Recent runs</h2>
      <div id="run-list" class="runs"></div>
      <div class="row-actions">
        <button id="btn-refresh-runs" type="button" class="secondary">Refresh</button>
      </div>
    </section>

    <section id="panel-report" class="panel full" hidden>
      <div class="report-header">
        <h2 id="report-title">Report</h2>
        <a id="link-report-site" class="report-site-link" target="_blank" rel="noopener" hidden>Report site</a>
        <button id="btn-close-report" type="button" class="secondary">Close</button>
      </div>
      <iframe id="report-frame" sandbox="allow-same-origin"></iframe>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
