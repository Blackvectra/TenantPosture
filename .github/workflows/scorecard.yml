# OSSF Scorecard — automated security-health metric.
#
# Runs the OpenSSF Scorecard checks (branch-protection, signed-releases,
# pinned dependencies, CodeQL presence, fuzzing, token permissions, etc.)
# weekly and on push to main. Results upload to Code Scanning so the
# Scorecard score appears alongside other security findings.
#
# Adds zero runtime cost — runs on its own schedule.

name: OSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [ main ]

# Nothing at the workflow level; the one job declares exactly what it uses.
permissions: {}

# One run per workflow and ref at a time; a release or scorecard run in
# progress is never cancelled by a newer one, which waits instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # OSSF Scorecard only supports PUBLIC repositories: several of its checks
    # (ListCommits / contributors / branch-protection via GraphQL) require a
    # token scope the default GITHUB_TOKEN does not have on a private repo, so
    # the action hard-errors with "Resource not accessible by integration" and
    # fails the run on every push. Gate the job on visibility — it is cleanly
    # SKIPPED while this repo is private and starts running automatically if it
    # is ever made public. No red X, no lost coverage.
    if: ${{ github.event.repository.private == false }}
    permissions:
      security-events: write  # upload the SARIF results to Code Scanning
      id-token: write  # publish results and get a badge (OIDC)
      contents: read  # read the repository
      actions: read  # read workflow runs for the token-permissions and CI checks

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        # SHA-pinned (not tag-pinned) per CodeQL's supply-chain rule:
        # ossf/scorecard-action is 3rd-party, so a moving tag would let
        # the maintainer (or an attacker who compromises the org) re-point
        # `v2` at any future commit. Pin the exact tree we trust today.
        # Dependabot (github-actions ecosystem) will open a PR when this
        # action publishes a newer release, with the new SHA in the diff.
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repos do not need publish_results; keep false to avoid
          # an extra api call.
          publish_results: false

      - name: Upload artifact (5-day retention)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: ossf-scorecard
