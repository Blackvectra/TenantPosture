# CodeQL Advanced — code scanning for this repo.
#
# Scope: this is a PowerShell repo. CodeQL does NOT natively support
# PowerShell (the supported set is c-cpp, csharp, go, java-kotlin,
# javascript-typescript, python, ruby, rust, swift, actions). We therefore
# scan only `actions` here, which analyses the GitHub-Actions workflow
# YAML for supply-chain weaknesses (untrusted command injection in
# `run:` blocks, untrusted action versions, etc.).
#
# PowerShell source code is scanned in the regular CI workflow via
# PSScriptAnalyzer with SARIF upload to the same Code Scanning UI — see
# `.github/workflows/ci.yml` for that integration.

name: "CodeQL Advanced"

# TEMPORARILY PAUSED — GitHub Actions minutes / spending limit reached on this
# account, so every run failed instantly without ever being assigned a runner
# and produced a flood of failure notifications. Automatic triggers are
# commented out below; each workflow can still be run by hand from the
# Actions tab via workflow_dispatch.
#
# TO RESTORE once billing is sorted: delete the `workflow_dispatch:` line and
# uncomment the original trigger block underneath it.
on:
  workflow_dispatch:
#   push:
#     branches: [ "main" ]
#   pull_request:
#     branches: [ "main" ]
#   schedule:
#     - cron: '23 13 * * 2'
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # CodeQL Code Scanning requires GitHub Advanced Security on private
    # repos. Skip on private so the workflow doesn't surface "Code
    # scanning is not enabled" configuration errors that look like real
    # code-quality failures. When the repo flips back to public, this
    # job re-enables automatically. (PowerShell static analysis still
    # runs via PSScriptAnalyzer in ci.yml regardless of repo visibility.)
    if: github.event.repository.private == false
    permissions:
      # required to publish results to Code Scanning
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # required for reading the repo
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Enable the broader security query packs for thorough scanning of
          # the action-workflow YAML. `security-extended` adds higher-recall
          # security queries; `security-and-quality` adds maintainability
          # queries on top of that.
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
