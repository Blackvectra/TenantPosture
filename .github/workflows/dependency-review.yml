# Dependency Review — checks every PR for changes that add a known-vulnerable
# dependency or relax a license constraint.
#
# Scope on this repo: PowerShell modules from PSGallery are not tracked by
# GitHub's dependency graph (no PSGallery ecosystem support), so this
# workflow primarily protects the GitHub Actions versions used in the
# workflow files. That's still meaningful: it blocks PRs that pin to an
# action whose version has a known CVE, or that bumps to a license you
# don't want to ship under.

name: Dependency Review

# TEMPORARILY PAUSED — GitHub Actions minutes / spending limit reached on this
# account, so every run failed instantly without ever being assigned a runner
# and produced a flood of failure notifications. Automatic triggers are
# commented out below; each workflow can still be run by hand from the
# Actions tab via workflow_dispatch.
#
# TO RESTORE once billing is sorted: delete the `workflow_dispatch:` line and
# uncomment the original trigger block underneath it.
on:
  workflow_dispatch:
#   pull_request:
#     branches: [ main ]
permissions:
  contents: read
  # required to comment on PRs with the findings summary
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # GitHub Dependency Graph + Dependency Review API requires GitHub
    # Advanced Security on private repos. Skip on private repos so the
    # workflow doesn't surface "configuration error" failures
    # masquerading as code-quality issues. When the repo flips back to
    # public, this job re-enables automatically.
    if: github.event.repository.private == false
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block PRs that introduce moderate-or-higher severity vulnerabilities.
          # That is the load-bearing check.
          fail-on-severity: moderate
          # License audit is intentionally NOT enforced. GitHub's dependency
          # graph rarely surfaces a license string for github-actions deps
          # (the SPDX-id field is null for most action repos), which makes
          # an allow-list effectively a deny-all-with-known-license filter
          # that blocks legitimate first-party actions on first introduction.
          # If license discipline matters later, gate via deny-licenses on
          # specific licenses (GPL-3.0, AGPL-3.0) instead of allow-listing.
          comment-summary-in-pr: on-failure
