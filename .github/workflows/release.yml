# Release pipeline — runs only on version tags (v*).
#
# Two jobs:
#   sbom        — generates a CycloneDX SBOM from tools/Generate-SBOM.ps1 and
#                 attaches it to the workflow run (and the GitHub Release if
#                 one exists for the tag).
#   authenticode — on windows-latest, verifies Authenticode signatures + the
#                 integrity manifest. It cannot SIGN (no cert in CI — signing
#                 is a local operator step via Build/Sign-Release.ps1); it
#                 VERIFIES. A HashMismatch (file changed after signing) fails
#                 the job; NotSigned fails when the repository variable
#                 TP_REQUIRE_SIGNED is 'true' and is otherwise stated in the
#                 release notes, never described as verified.
#   package     — allowlisted archive + FILES.sha256 inside it + SHA256SUMS,
#                 attested with actions/attest-build-provenance, published
#                 through the 'release' environment.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # The one allowlist of what ships. The package job copies these folders and
  # the authenticode job judges only them, so a test or maintenance script
  # outside the archive can never mark a release unsigned.
  SHIP_DIRS: 'Apply Build Collectors Config Device Email-IR Evaluators Lib Onboard Publishers Web baselines docs sample-headers sample-report tools'
  SHIP_ROOT_EXTENSIONS: '.ps1 .psm1 .psd1 .md .txt'

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Generate SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/Generate-SBOM.ps1 -OutputPath ./sbom/tp-assessment.cdx.json
          if (-not (Test-Path -LiteralPath ./sbom/tp-assessment.cdx.json)) {
              throw 'SBOM generation produced no output file.'
          }
          $sbom = Get-Content -LiteralPath ./sbom/tp-assessment.cdx.json -Raw | ConvertFrom-Json
          Write-Host ('SBOM OK: {0} components, format {1}' -f @($sbom.components).Count, $sbom.bomFormat)

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: sbom/tp-assessment.cdx.json
          if-no-files-found: error

  package:
    name: Package + checksums
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs only after the verification jobs pass — a release asset is never
    # published from a tree that failed SBOM generation or integrity checks.
    needs: [sbom, authenticode]
    # A protected environment: configure required reviewers on it in the
    # repository settings and no release asset is published without a person.
    environment: release
    permissions:
      # Needed to create/update the GitHub Release and upload assets.
      contents: write
      # Needed by attest-build-provenance.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Download SBOM from the sbom job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx
          path: sbom/

      - name: Build release zip + SHA256SUMS
        shell: pwsh
        env:
          # The tag reaches the script as an environment variable, never
          # interpolated into source, and must be a plain semantic version.
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Refusing to package tag '$tag': release tags are v<major>.<minor>.<patch>." }
          # The archive, the module and the SBOM must agree on one version.
          $moduleVersion = [string](Import-PowerShellDataFile -LiteralPath ./TenantPosture.psd1).ModuleVersion
          if ($tag -ne "v$moduleVersion") { throw "Tag '$tag' does not match TenantPosture.psd1 ModuleVersion '$moduleVersion'. Bump the manifest (see docs/RELEASING.md) and re-tag." }
          $name = "TenantPosture-$tag"
          # Allowlist what ships. Anything not named here (tests, CI, scanner
          # config, the repo's own tooling, output) stays out of the archive.
          $shipDirs  = @($env:SHIP_DIRS -split ' ')
          $shipExt   = @($env:SHIP_ROOT_EXTENSIONS -split ' ')
          # TenantPosture.cat (Build/Sign-Release.ps1) describes the signed repository
          # tree, not this archive, so it is not shipped; the archive's own record is
          # FILES.sha256 plus the provenance attestation.
          $shipFiles = @(Get-ChildItem -File | Where-Object { $_.Extension -in $shipExt -or $_.Name -in 'LICENSE', 'NOTICE', 'CITATION.cff' })
          $dropInside = '[\\/](Testing|__pycache__)([\\/]|$)'
          New-Item -ItemType Directory -Path "./$name" | Out-Null
          foreach ($d in $shipDirs) {
              if (-not (Test-Path -LiteralPath "./$d" -PathType Container)) { continue }
              Get-ChildItem -LiteralPath "./$d" -Recurse -File | Where-Object { $_.FullName -notmatch $dropInside } | ForEach-Object {
                  $rel = [System.IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName)
                  $dest = Join-Path "./$name" $rel
                  New-Item -ItemType Directory -Path (Split-Path -Parent $dest) -Force | Out-Null
                  Copy-Item -LiteralPath $_.FullName -Destination $dest
              }
          }
          foreach ($f in $shipFiles) { Copy-Item -LiteralPath $f.FullName -Destination "./$name/" }
          # A per-file manifest travels inside the archive: the release's own
          # integrity record, generated from the tree that was packaged.
          $manifest = Get-ChildItem -LiteralPath "./$name" -Recurse -File | Sort-Object FullName | ForEach-Object {
              '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), [System.IO.Path]::GetRelativePath("./$name", $_.FullName).Replace('\', '/')
          }
          $manifest | Out-File -FilePath "./$name/FILES.sha256" -Encoding utf8NoBOM
          Compress-Archive -Path "./$name" -DestinationPath "./$name.zip"
          $sums = foreach ($f in @("./$name.zip", './sbom/tp-assessment.cdx.json')) {
              if (Test-Path -LiteralPath $f) {
                  $h = (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash.ToLower()
                  '{0}  {1}' -f $h, (Split-Path $f -Leaf)
              }
          }
          $sums | Out-File -FilePath ./SHA256SUMS -Encoding utf8NoBOM
          Get-Content ./SHA256SUMS
          Write-Host ("Packaged {0} file(s). Clients verify with: (Get-FileHash $name.zip -Algorithm SHA256).Hash" -f @($manifest).Count)

      # Build provenance: a signed statement from GitHub that THIS workflow on
      # THIS commit produced these bytes. Verify with:
      #   gh attestation verify TenantPosture-<tag>.zip --owner Blackvectra
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            TenantPosture-${{ github.ref_name }}.zip
            SHA256SUMS
            sbom/tp-assessment.cdx.json

      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SIGNED: ${{ needs.authenticode.outputs.signed }}
          SIGNED_VALID: ${{ needs.authenticode.outputs.valid }}
          SIGNED_NOT: ${{ needs.authenticode.outputs.notsigned }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Refusing to publish tag '$tag'." }
          # Create the release if the tag doesn't have one yet (idempotent),
          # with auto-generated notes categorized by .github/release.yml.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
              gh release create $tag --title "TenantPosture $tag" --generate-notes --draft
          }
          $assets = @("TenantPosture-$tag.zip", 'SHA256SUMS')
          if (Test-Path -LiteralPath ./sbom/tp-assessment.cdx.json) { $assets += './sbom/tp-assessment.cdx.json' }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed (exit $LASTEXITCODE); --clobber may have removed an earlier asset, so the release is incomplete." }
          # The release body states the signing state plainly: an unsigned
          # archive is never described as verified.
          $verifyHint = 'integrity rests on SHA256SUMS, FILES.sha256 inside the archive, and the build provenance attestation (`gh attestation verify TenantPosture-' + $tag + '.zip --owner Blackvectra`).'
          $note = if ($env:SIGNED -eq 'true') { 'Authenticode: every script in this release carries a valid signature.' }
                  elseif ([int]$env:SIGNED_VALID -gt 0) { '**Partially signed release.** ' + $env:SIGNED_VALID + ' script(s) carry a valid Authenticode signature and ' + $env:SIGNED_NOT + ' do not; ' + $verifyHint }
                  else { '**Unsigned release.** The scripts carry no Authenticode signature; ' + $verifyHint }
          # Replace any earlier signing paragraph (a rebuilt tag can change the
          # result) rather than appending once and keeping a stale statement.
          # Native output is a line array: join with newlines (a [string] cast joins
          # with spaces) and pass the notes through a file so nothing is flattened.
          $bodyLines = @(gh release view $tag --json body --jq .body)
          if ($LASTEXITCODE -ne 0) { throw "gh release view failed (exit $LASTEXITCODE); not rewriting the release notes from an unread body." }
          $body = ($bodyLines -join "`n")
          $body = [regex]::Replace($body, '(?m)^(\*\*Unsigned release\.\*\*|\*\*Partially signed release\.\*\*|Authenticode:)[^\r\n]*(\r?\n)*', '').TrimEnd()
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllText($notesFile, ($body + "`n`n" + $note), [System.Text.UTF8Encoding]::new($false))
          gh release edit $tag --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw "gh release edit failed (exit $LASTEXITCODE); the release notes do not state the signing result." }
          Write-Host "Assets uploaded to release $tag (draft until published)."

  authenticode:
    name: Authenticode + integrity check
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      signed: ${{ steps.sig.outputs.signed }}
      valid: ${{ steps.sig.outputs.valid }}
      notsigned: ${{ steps.sig.outputs.notsigned }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Verify integrity manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath ./tools/integrity-manifest.txt) {
              # Re-hash the tree and diff against the committed manifest. The
              # script writes with -Update; here we compare current hashes to
              # the manifest and fail on any mismatch.
              $manifest = Get-Content -LiteralPath ./tools/integrity-manifest.txt |
                          Where-Object { $_ -and -not $_.StartsWith('#') }
              $mismatch = 0
              foreach ($line in $manifest) {
                  $parts = $line -split '\s+', 2
                  if ($parts.Count -ne 2) { continue }
                  $expected = $parts[0]; $rel = $parts[1].Trim()
                  if (Test-Path -LiteralPath $rel) {
                      $actual = (Get-FileHash -LiteralPath $rel -Algorithm SHA256).Hash
                      if ($actual -ne $expected) {
                          Write-Host ("  [MISMATCH] $rel") -ForegroundColor Red
                          $mismatch++
                      }
                  } else {
                      Write-Host ("  [MISSING]  $rel") -ForegroundColor Yellow
                  }
              }
              if ($mismatch -gt 0) { throw "$mismatch file(s) do not match the integrity manifest." }
              Write-Host '  [+] Integrity manifest verified.' -ForegroundColor Green
          } else {
              # No committed manifest: the release's own record is FILES.sha256,
              # generated from the packaged tree and attested with it. This step
              # is only a check that a committed manifest, when one exists, matches.
              Write-Host '  [i] No committed integrity manifest; the packaged FILES.sha256 and the provenance attestation are the release record.'
          }

      - name: Authenticode signature status
        id: sig
        shell: pwsh
        env:
          # This job sees the COMMIT the tag points at, never a working tree,
          # so a release is "signed" only when the signed files were committed
          # before tagging (Build/Sign-Release.ps1, then commit, then tag). Set
          # the repository variable TP_REQUIRE_SIGNED to 'true' once that is the
          # practice; the job then fails on any unsigned script instead of
          # publishing an unsigned release.
          REQUIRE_SIGNED: ${{ vars.TP_REQUIRE_SIGNED }}
          # The SHA-1 thumbprint of the in-house signing certificate, when the
          # release is signed with a self-signed cert no runner trusts.
          EXPECTED_THUMBPRINT: ${{ vars.TP_SIGNING_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Judge the files that ship (the package job's allowlist), nothing else.
          $shipDirs = @($env:SHIP_DIRS -split ' ')
          $dropInside = '[\\/](Testing|__pycache__)([\\/]|$)'
          # Get-ChildItem -Include without -Recurse returns nothing; filter by extension instead.
          $files = @(Get-ChildItem -File | Where-Object { $_.Extension -in '.ps1', '.psm1', '.psd1' })
          foreach ($d in $shipDirs) {
              if (Test-Path -LiteralPath "./$d" -PathType Container) {
                  $files += @(Get-ChildItem -LiteralPath "./$d" -Recurse -File -Include '*.ps1','*.psm1','*.psd1' | Where-Object { $_.FullName -notmatch $dropInside })
              }
          }
          $valid = 0; $notSigned = 0; $bad = 0; $pinned = 0
          foreach ($f in $files) {
              $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
              switch ($sig.Status) {
                  'Valid'        { $valid++ }
                  'NotSigned'    { $notSigned++ }
                  { $_ -in 'NotTrusted', 'UnknownError' } {
                      # UnknownError is also what PowerShell reports for a file that IS
                      # signed by a root this host has never seen; with no signer
                      # certificate at all it is simply not signed.
                      # A self-signed in-house signer (Build/New-TPCodeSigningCert.ps1) is
                      # trusted only in the operator's own stores, so a fresh runner reports
                      # NotTrusted. It counts as signed only when the signer's thumbprint
                      # equals the repository variable TP_SIGNING_THUMBPRINT: a pinned
                      # expected root, never any untrusted signer.
                      $tp = if ($sig.SignerCertificate) { [string]$sig.SignerCertificate.Thumbprint } else { '' }
                      if (-not $tp -and $sig.Status -eq 'UnknownError') { $notSigned++ }
                      elseif ($tp -and $env:EXPECTED_THUMBPRINT -and $tp -eq $env:EXPECTED_THUMBPRINT) { $valid++; $pinned++ }
                      else { $bad++; Write-Host ("  [{0}, signer '{1}' is not the pinned thumbprint] {2}" -f $sig.Status, $tp, $f.Name) -ForegroundColor Red }
                  }
                  default        { $bad++; Write-Host ("  [{0}] {1}" -f $sig.Status, $f.Name) -ForegroundColor Red }
              }
          }
          Write-Host ('Authenticode summary — Valid: {0} (of which {3} by pinned in-house signer)  NotSigned: {1}  Problem: {2}' -f $valid, $notSigned, $bad, $pinned)
          # HashMismatch / Expired / UntrustedRoot = real tamper/trust signals → fail.
          # NotSigned alone is tolerated (in-house releases sign locally).
          if ($bad -gt 0) { throw "$bad file(s) have a bad Authenticode status (tamper or trust failure)." }
          $signed = ($notSigned -eq 0 -and $valid -gt 0)
          if (-not $signed -and $env:REQUIRE_SIGNED -eq 'true') { throw "$notSigned file(s) are not signed and TP_REQUIRE_SIGNED is set." }
          if (-not $signed) {
              Write-Host '  [i] Release is unsigned; the release notes will say so. Sign locally with Build/Sign-Release.ps1 before tagging, or set TP_REQUIRE_SIGNED to fail here.' -ForegroundColor Yellow
          }
          "signed=$($signed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "valid=$valid" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "notsigned=$notSigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
