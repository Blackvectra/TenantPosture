name: CI

on:
  # Manual runs stay available alongside the automatic triggers.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  pester:
    name: Pester Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Pester (>= 5.5.0)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Fast-path: if a satisfying Pester is already on the runner, skip the
          # network call entirely. (Whether ubuntu-latest preinstalls Pester
          # depends on the runner image version, so we don't claim it does —
          # this is a no-op skip when no module is present.)
          $have = Get-Module -ListAvailable Pester |
                  Where-Object { $_.Version -ge [version]'5.5.0' } |
                  Sort-Object Version -Descending |
                  Select-Object -First 1
          if ($have) {
              Write-Host ('Pester {0} already installed at {1} — skipping install.' -f $have.Version, $have.ModuleBase)
              return
          }

          # Slow path: retry the install up to 3x with exponential backoff to
          # ride out brief PSGallery / PSResourceGet hiccups. The upper bound
          # '[5.5.0,5.99.99]' prevents an unreleased breaking 6.x from being
          # auto-adopted on the next CI run (CI green is a load-bearing signal;
          # bumping the major needs to be a deliberate edit, not a surprise).
          $delays = @(2, 4, 8)
          $lastErr = $null
          for ($i = 0; $i -lt $delays.Length; $i++) {
              try {
                  if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
                      Install-PSResource -Name Pester -Version '[5.5.0,5.99.99]' -TrustRepository -Scope CurrentUser -ErrorAction Stop
                  } else {
                      if (Get-PSRepository PSGallery -ErrorAction SilentlyContinue) {
                          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
                      }
                      Install-Module -Name Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber -ErrorAction Stop
                  }
                  $lastErr = $null
                  break
              } catch {
                  $lastErr = $_
                  Write-Host ('Install attempt failed: {0}' -f $_.Exception.Message) -ForegroundColor Yellow
                  if ($i -lt $delays.Length - 1) {
                      Write-Host ('Retrying in {0}s...' -f $delays[$i])
                      Start-Sleep -Seconds $delays[$i]
                  }
              }
          }
          if ($lastErr) { throw $lastErr }

          (Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1).Version

      - name: Diagnostics — pwsh + Pester + parse test file
        shell: pwsh
        run: |
          Write-Host ('pwsh version: {0}' -f $PSVersionTable.PSVersion)
          Write-Host ('OS: {0}' -f $PSVersionTable.OS)
          $p = (Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1)
          Write-Host ('Pester version: {0} at {1}' -f $p.Version, $p.ModuleBase)

          # AST parse check over EVERY test file — distinguishes syntax errors
          # from Pester runtime issues before the suite runs.
          $bad = $false
          foreach ($tf in Get-ChildItem ./Testing -Filter '*.Tests.ps1' -File) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $tf.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $bad = $true
              Write-Host ('PARSE ERRORS IN {0}:' -f $tf.Name) -ForegroundColor Red
              $errors | ForEach-Object { Write-Host ('  Line {0}: {1}' -f $_.Extent.StartLineNumber, $_.Message) }
            }
          }
          if ($bad) { throw 'One or more test files do not parse — fix syntax before Pester can run.' }
          Write-Host 'All test files AST-parse cleanly.'

      - name: Run Pester
        shell: pwsh
        run: |
          # Run the ENTIRE Testing/ suite. This previously ran only
          # NRG.Security.Tests.ps1, which meant the framework-accuracy guards
          # (SCuBA/CIS/CMMC/ISO citation validation), the Graph-shape tests,
          # and the reader-helper tests existed but never gated a merge — the
          # 70-citation SCuBA mis-mapping shipped precisely because these
          # weren't enforced. ScubaGear runs its full unit suite in CI; so do we.
          $config = New-PesterConfiguration
          # Email-IR/Testing too: it held 6 failing tests that no merge ever saw.
          $config.Run.Path = @('./Testing', './Email-IR/Testing')
          $config.Run.Exit = $true
          $config.Run.Throw = $false
          $config.Output.Verbosity = 'Diagnostic'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'pester-results.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $config

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pester-results
          path: pester-results.xml
          if-no-files-found: warn

  # The local web GUI's real-server tests on Windows. The Pester job above runs
  # on Ubuntu without Pode, so it skips that context; this job installs Pode and
  # runs it where the tool is actually used. What it adds over Ubuntu: NTFS
  # symbolic links, junctions and hard links (the report-folder link guard),
  # Windows path semantics, and the loopback server itself.
  web-gui-windows:
    name: Web GUI (Windows, real server)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Pester (>= 5.5.0) and Pode (>= 2.10.0)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The runner image ships Pester 3.4 for Windows PowerShell; the version
          # is therefore asked for, and imported, explicitly. Retried 3x to ride
          # out a brief PSGallery hiccup; upper bounds keep an unreleased major
          # from being adopted by surprise.
          $wanted = @(
              @{ Name = 'Pester'; Min = '5.5.0'; Max = '5.99.99' },
              @{ Name = 'Pode';   Min = '2.10.0'; Max = '2.99.99' }
          )
          foreach ($m in $wanted) {
              $delays = @(2, 4, 8)
              $lastErr = $null
              for ($i = 0; $i -lt $delays.Length; $i++) {
                  try {
                      Install-Module -Name $m.Name -MinimumVersion $m.Min -MaximumVersion $m.Max -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber -ErrorAction Stop
                      $lastErr = $null
                      break
                  } catch {
                      $lastErr = $_
                      Write-Host ('Install of {0} failed: {1}' -f $m.Name, $_.Exception.Message) -ForegroundColor Yellow
                      if ($i -lt $delays.Length - 1) { Start-Sleep -Seconds $delays[$i] }
                  }
              }
              if ($lastErr) { throw $lastErr }
          }
          Import-Module Pester -MinimumVersion 5.5.0 -Force
          Write-Host ('pwsh {0} on {1}' -f $PSVersionTable.PSVersion, $PSVersionTable.OS)
          Write-Host ('Pester {0}' -f (Get-Module Pester).Version)
          Write-Host ('Pode   {0}' -f (Get-Module -ListAvailable Pode | Sort-Object Version -Descending | Select-Object -First 1).Version)

      - name: Run the web GUI tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = @('./Testing/NRG.WebServer.Tests.ps1')
          $config.Run.Exit = $true
          $config.Run.Throw = $false
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'pester-web-windows.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $config

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pester-web-windows
          path: pester-web-windows.xml
          if-no-files-found: warn

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # security-events: write is required for the upload-sarif step at the
      # bottom of this job. Without it, the SARIF upload silently no-ops and
      # PowerShell findings never reach the Code Scanning UI.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Fast-path: skip the gallery round-trip if a module is already
          # present. (Whether ubuntu-latest preinstalls PSScriptAnalyzer
          # depends on the runner image version.)
          $have = Get-Module -ListAvailable PSScriptAnalyzer |
                  Sort-Object Version -Descending |
                  Select-Object -First 1
          if ($have) {
              Write-Host ('PSScriptAnalyzer {0} already installed at {1} — skipping install.' -f $have.Version, $have.ModuleBase)
              return
          }

          # Slow path: retry 3x with exponential backoff to ride out brief
          # PSGallery / PSResourceGet transient failures. Pinned <2.x to
          # prevent a future breaking major from auto-adopting on every run.
          $delays = @(2, 4, 8)
          $lastErr = $null
          for ($i = 0; $i -lt $delays.Length; $i++) {
              try {
                  if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
                      Install-PSResource -Name PSScriptAnalyzer -Version '[1.21.0,1.99.99]' -TrustRepository -Scope CurrentUser -ErrorAction Stop
                  } else {
                      if (Get-PSRepository PSGallery -ErrorAction SilentlyContinue) {
                          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
                      }
                      Install-Module -Name PSScriptAnalyzer -MinimumVersion 1.21.0 -MaximumVersion 1.99.99 -Force -Scope CurrentUser -AllowClobber -ErrorAction Stop
                  }
                  $lastErr = $null
                  break
              } catch {
                  $lastErr = $_
                  Write-Host ('Install attempt failed: {0}' -f $_.Exception.Message) -ForegroundColor Yellow
                  if ($i -lt $delays.Length - 1) {
                      Write-Host ('Retrying in {0}s...' -f $delays[$i])
                      Start-Sleep -Seconds $delays[$i]
                  }
              }
          }
          if ($lastErr) { throw $lastErr }

      - name: Run analyzer
        shell: pwsh
        run: |
          $settings = Resolve-Path ./PSScriptAnalyzerSettings.psd1
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings $settings)

          $errors   = @($results | Where-Object Severity -eq 'Error')
          $warnings = @($results | Where-Object Severity -eq 'Warning')
          $infos    = @($results | Where-Object Severity -eq 'Information')

          # ── Console summary (always) ────────────────────────────────────────
          Write-Host ''
          Write-Host 'PSScriptAnalyzer summary:' -ForegroundColor Cyan
          Write-Host ('  Errors:        {0}' -f $errors.Count)
          Write-Host ('  Warnings:      {0}' -f $warnings.Count)
          Write-Host ('  Informational: {0}' -f $infos.Count)
          Write-Host ''
          if ($errors.Count -gt 0) {
            Write-Host 'Errors (CI fails on these):' -ForegroundColor Red
            $errors | Format-Table RuleName,Severity,ScriptName,Line,Message -AutoSize -Wrap
          }
          if ($warnings.Count -gt 0) {
            Write-Host 'Warnings (informational — does not fail CI):' -ForegroundColor Yellow
            $warnings | Format-Table RuleName,Severity,ScriptName,Line,Message -AutoSize -Wrap
          }

          # ── Emit SARIF only when there are Error-severity findings ─────────
          # Code Scanning creates a "failure" check-run for every SARIF upload
          # whose `results` array is non-empty — including warnings and notes.
          # Our codebase has ~100 long-standing warnings (PSAvoidUsing* style),
          # so uploading a full SARIF would surface a permanent "failure" check
          # on every push, even when nothing is actionable. Upload SARIF only
          # when there are real Errors to triage; warnings remain visible in
          # the workflow-log table above.
          if ($errors.Count -gt 0) {
              $repoRoot = (Resolve-Path '.').Path
              $sarifResults = @(foreach ($r in $errors) {
                  $rel = if ($r.ScriptPath) {
                      ([System.IO.Path]::GetRelativePath($repoRoot, $r.ScriptPath)) -replace '\\','/'
                  } else { '' }
                  [pscustomobject]@{
                      ruleId  = $r.RuleName
                      level   = 'error'
                      message = @{ text = [string]$r.Message }
                      locations = @(@{
                          physicalLocation = @{
                              artifactLocation = @{ uri = $rel }
                              region = @{
                                  # SARIF 2.1.0 requires startLine/startColumn >= 1.
                                  # PSScriptAnalyzer occasionally emits 0 for whole-
                                  # file rules; clamp those up to 1.
                                  startLine   = [Math]::Max(1, [int]$r.Line)
                                  startColumn = [Math]::Max(1, [int]$r.Column)
                              }
                          }
                      })
                  }
              })
              $sarif = [ordered]@{
                  '$schema' = 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json'
                  version   = '2.1.0'
                  runs      = @(@{
                      tool = @{
                          driver = @{
                              name            = 'PSScriptAnalyzer'
                              version         = ([string](Get-Module -ListAvailable PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1).Version)
                              informationUri  = 'https://github.com/PowerShell/PSScriptAnalyzer'
                          }
                      }
                      results = $sarifResults
                  })
              }
              $sarif | ConvertTo-Json -Depth 12 | Out-File -LiteralPath ./psscriptanalyzer.sarif -Encoding utf8NoBOM
              Write-Host ('Wrote SARIF with {0} Error finding(s) for Code Scanning.' -f $sarifResults.Count)
          } else {
              Write-Host 'No Error-severity findings — skipping SARIF upload.' -ForegroundColor Green
          }

          # ── Gate ────────────────────────────────────────────────────────────
          if ($errors.Count -gt 0) {
            throw ("PSScriptAnalyzer found {0} Error-severity finding(s)." -f $errors.Count)
          }

      - name: Upload PSScriptAnalyzer results to Code Scanning
        # Run even if the analyzer step failed, so Error-severity findings
        # still surface in the Code Scanning UI for triage.
        if: always() && hashFiles('psscriptanalyzer.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: psscriptanalyzer.sarif
          # `category` namespaces results so PSScriptAnalyzer findings don't
          # collide with CodeQL findings in the same repo.
          category: psscriptanalyzer

  docs-lint:
    name: YAML + Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Lint YAML (workflows and config)
        run: |
          pip install --quiet yamllint
          yamllint -c .yamllint.yml .github Config

      - name: Check Markdown (code fences and relative links)
        run: python3 tools/Test-MarkdownDocs.py

  export-sync:
    name: Export List Sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Validate export lists in sync
        shell: pwsh
        run: |
          & ./tools/Sync-ExportedFunctions.ps1 -Validate

  manifest:
    name: Module Manifest + controls.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Validate manifest parses + has required fields
        shell: pwsh
        run: |
          # Test-ModuleManifest loads RequiredModules to validate them — those
          # aren't installed in CI (Microsoft.Graph / EXO / Teams = 500MB and
          # ~3 min to install). Use Import-PowerShellDataFile instead: catches
          # syntax errors and lets us assert the structural fields directly.
          $m = Import-PowerShellDataFile -LiteralPath ./NRG-Assessment.psd1 -ErrorAction Stop

          $required = @('ModuleVersion','GUID','Author','RootModule','FunctionsToExport','PowerShellVersion','CompatiblePSEditions')
          $missing = $required | Where-Object { -not $m.ContainsKey($_) }
          if ($missing) { throw ('Manifest missing required keys: {0}' -f ($missing -join ', ')) }

          if ($m.ModuleVersion -notmatch '^\d+\.\d+\.\d+') {
            throw ('ModuleVersion "{0}" is not a valid semver prefix' -f $m.ModuleVersion)
          }
          if (-not (Test-Path -LiteralPath (Join-Path '.' $m.RootModule))) {
            throw ('RootModule "{0}" not found on disk' -f $m.RootModule)
          }

          Write-Host ('Manifest valid: v{0}' -f $m.ModuleVersion)
          Write-Host ('FunctionsToExport count: {0}' -f @($m.FunctionsToExport).Count)
          Write-Host ('PSEdition: {0}' -f ($m.CompatiblePSEditions -join ', '))
          Write-Host ('PowerShellVersion: {0}' -f $m.PowerShellVersion)
          if ($m.RequiredModules) {
            Write-Host ('Required modules: {0}' -f @($m.RequiredModules).Count)
          }

      - name: Validate controls.json parses
        shell: pwsh
        run: |
          $j = Get-Content -LiteralPath ./Config/controls.json -Raw | ConvertFrom-Json -ErrorAction Stop
          if (-not $j.controls) { throw 'controls.json missing top-level "controls" array.' }
          Write-Host ('controls.json: {0} controls' -f $j.controls.Count)

      - name: Schema Validation — controls.json + clients.json
        shell: pwsh
        run: |
          # Enforce the JSON Schemas (draft-07, supported by Test-Json on
          # pwsh 7.4+). Mirrors ScubaGear's ScubaConfigValidator practice of
          # machine-validating tool configuration before use — a malformed
          # control row or client row fails the PR, not the client engagement.
          $checks = @(
            @{ Data = './Config/controls.json'; Schema = './Config/schema/controls.schema.json' }
            @{ Data = './Config/clients.json';  Schema = './Config/schema/clients.schema.json' }
          )
          $failed = $false
          foreach ($c in $checks) {
            $raw = Get-Content -LiteralPath $c.Data -Raw
            $errs = $null
            $ok = Test-Json -Json $raw -SchemaFile $c.Schema -ErrorAction SilentlyContinue -ErrorVariable errs
            if ($ok) {
              Write-Host ('PASS  {0} conforms to {1}' -f $c.Data, $c.Schema) -ForegroundColor Green
            } else {
              $failed = $true
              Write-Host ('FAIL  {0} violates {1}:' -f $c.Data, $c.Schema) -ForegroundColor Red
              $errs | ForEach-Object { Write-Host ('  {0}' -f $_.Exception.Message) }
            }
          }
          if ($failed) { throw 'JSON Schema validation failed — see errors above.' }
