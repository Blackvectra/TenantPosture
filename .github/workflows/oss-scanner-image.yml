# OSS Scanner image — builds .oss-scanner/Dockerfile so a broken pin or a
# module that no longer imports shows as a red check on the pull request,
# not as a failed scanner submission.
#
# The build installs every pinned dependency (base image by digest, Ubuntu's
# security updates, Python packages by SHA-256, PowerShell modules through
# tools/Install-TPPinnedModule.ps1), validates the export lists, imports the
# module and runs the full suite through the test gate. A failing test does not
# stop the image build (the scanner must still be able to run), so this job
# reads the gate's recorded exit code out of the image and fails on anything
# but 0, publishing the log and NUnit results as an artifact. The image is then
# started with no network to prove it runs offline, as the scanner runs it.
# Nothing is pushed to a registry.
#
# The built image is then scanned with Trivy (.github/scanners/trivy/Dockerfile
# pins the scanner by tag and digest; the job reads the FROM line) for HIGH and
# CRITICAL vulnerabilities in the operating system and the packages installed,
# and a second job checks .oss-scanner/Dockerfile against Trivy's Dockerfile
# rules at every severity. Any finding fails, except one reviewed into
# .trivyignore.yaml with a statement a reviewer can check, and a vulnerability
# the distribution has no fix for (--ignore-unfixed: the weekly rebuild takes
# the fix when it ships, and nothing in this repository can act on it
# sooner). Both uploads go to Code Scanning.
#
# The weekly run also checks that every pinned PowerShell module is on the
# newest release of its major version (tools/Test-TPPinnedModuleFreshness.ps1),
# since Dependabot cannot read the PowerShell Gallery.

name: OSS Scanner image

on:
  # Manual runs stay available alongside the automatic triggers.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.oss-scanner/**'
      - '.dockerignore'
      - '.trivyignore.yaml'
      - '.github/scanners/trivy/**'
      - 'tools/pinned-modules.psd1'
      - 'tools/Install-TPPinnedModule.ps1'
      - 'tools/Sync-ExportedFunctions.ps1'
      - 'TenantPosture.psd1'
      - 'TenantPosture.psm1'
      - '.github/workflows/oss-scanner-image.yml'
  pull_request:
    branches: [main]
    paths:
      - '.oss-scanner/**'
      - '.dockerignore'
      - '.trivyignore.yaml'
      - '.github/scanners/trivy/**'
      - 'tools/pinned-modules.psd1'
      - 'tools/Install-TPPinnedModule.ps1'
      - 'tools/Sync-ExportedFunctions.ps1'
      - 'TenantPosture.psd1'
      - 'TenantPosture.psm1'
      - '.github/workflows/oss-scanner-image.yml'
  schedule:
    # Weekly, so an image that stopped building (a pulled package, a base
    # image digest gone from the registry) is found before a submission.
    - cron: '37 5 * * 4'
permissions:
  contents: read

# One run per workflow and pull request (or branch). A newer push to the same
# pull request cancels the older run; runs on main and scheduled runs are
# never cancelled, so every commit on main keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the OSS Scanner image
    runs-on: ubuntu-latest
    # The image runs the full Pester suite while it builds (about 15 minutes
    # in CI); the ceiling leaves room for the dependency installs.
    timeout-minutes: 45
    permissions:
      contents: read  # read the repository
      security-events: write  # upload the Trivy SARIF to Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build --pull --progress=plain -f .oss-scanner/Dockerfile -t tenantposture:ci .

      - name: Test results recorded in the image
        run: |
          docker create --name oss-test tenantposture:ci
          docker cp oss-test:/oss-test ./oss-test
          docker rm oss-test
          code="$(cat ./oss-test/exit-code)"
          echo "Test gate exit code inside the image: ${code}"
          if [ "${code}" != "0" ]; then
            # The log carries color codes, so match the failure marker anywhere on the line.
            grep -aF -- '[-]' ./oss-test/test.log | head -n 50 || true
            tail -n 40 ./oss-test/test.log
            echo "::error title=Tests failed inside the OSS Scanner image::The test gate exited ${code}. The log and NUnit results are in the oss-scanner-test-results artifact."
            exit 1
          fi

      - name: Upload the test log and results
        if: always() && hashFiles('oss-test/exit-code') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oss-scanner-test-results
          path: oss-test/
          if-no-files-found: warn

      - name: Run offline
        run: |
          docker run --rm --network none tenantposture:ci pwsh -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            Import-Module ./TenantPosture.psm1 -Force
            $n = @(Get-Command -Module TenantPosture).Count
            if ($n -lt 1) { throw "The module exported no functions." }
            "TenantPosture {0}: {1} functions, imported with no network" -f $TPAssessmentVersion, $n'

      - name: Scan the image for known vulnerabilities (Trivy)
        run: |
          set -euo pipefail
          image="$(awk '/^FROM /{print $2}' .github/scanners/trivy/Dockerfile)"
          echo "Trivy image: ${image}"
          # The image is handed to the scanner as an archive, so the scanner
          # container needs no Docker socket.
          docker save tenantposture:ci -o "$RUNNER_TEMP/tenantposture.tar"
          mkdir -p trivy-out
          scan() {
            docker run --rm \
              -v "$RUNNER_TEMP/tenantposture.tar:/scan/image.tar:ro" \
              -v "${PWD}/.trivyignore.yaml:/scan/.trivyignore.yaml:ro" \
              -v "${PWD}/trivy-out:/out" \
              -v trivy-cache:/root/.cache/trivy \
              "${image}" image --input /scan/image.tar --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /scan/.trivyignore.yaml \
              --skip-version-check "$@"
          }
          set +e
          scan --format sarif --output /out/trivy-image.sarif --exit-code 1
          rc=$?
          set -e
          # The table is for the log; the SARIF run above decided the result.
          scan --format table --exit-code 0
          if [ "${rc}" -ne 0 ]; then
            echo "::error title=Vulnerable packages in the OSS Scanner image::Trivy reported a HIGH or CRITICAL vulnerability with a fix available (exit ${rc}). Rebuild on the current base image, or review it into .trivyignore.yaml with a statement."
            exit 1
          fi

      - name: Upload the image scan to Code Scanning
        # Run even when the scan failed, so findings surface for triage.
        if: always() && hashFiles('trivy-out/trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-out/trivy-image.sarif
          category: trivy-image

  dockerfile-config:
    name: Dockerfile configuration (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # read the repository
      security-events: write  # upload the Trivy SARIF to Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the Dockerfile against Trivy's misconfiguration rules
        run: |
          set -euo pipefail
          image="$(awk '/^FROM /{print $2}' .github/scanners/trivy/Dockerfile)"
          echo "Trivy image: ${image}"
          mkdir -p trivy-out
          # Only .oss-scanner is mounted, so only it is scanned: the files under
          # .github/scanners are one-line pins the jobs read, never images that
          # are built or run. The scan root is the mount root, so a finding is
          # reported as .oss-scanner/Dockerfile, the path .trivyignore.yaml names.
          scan() {
            docker run --rm \
              -v "${PWD}/.oss-scanner:/scan/.oss-scanner:ro" \
              -v "${PWD}/.trivyignore.yaml:/scan/.trivyignore.yaml:ro" \
              -v "${PWD}/trivy-out:/out" \
              -v trivy-cache:/root/.cache/trivy \
              -w /scan "${image}" config --severity LOW,MEDIUM,HIGH,CRITICAL \
              --ignorefile /scan/.trivyignore.yaml --skip-version-check "$@" .
          }
          set +e
          scan --format sarif --output /out/trivy-config.sarif --exit-code 1
          rc=$?
          set -e
          scan --format table --exit-code 0
          if [ "${rc}" -ne 0 ]; then
            echo "::error title=Dockerfile misconfiguration::Trivy reported a finding in .oss-scanner/Dockerfile (exit ${rc}). Fix it, or review it into .trivyignore.yaml with a statement."
            exit 1
          fi

      - name: Upload the configuration scan to Code Scanning
        if: always() && hashFiles('trivy-out/trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-out/trivy-config.sarif
          category: trivy-config

  pinned-module-freshness:
    name: Pinned PowerShell modules are current
    # Weekly and on demand only: a module released upstream must not turn an
    # unrelated pull request red.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # read the repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the pins with the PowerShell Gallery
        shell: pwsh
        run: ./tools/Test-TPPinnedModuleFreshness.ps1
